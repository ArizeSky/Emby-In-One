# Pull-only deployment. See DOCKER.md / DOCKER_EN.md before first start.
# Set EIO_IMAGE to a verified, published GHCR tag or multi-platform digest.
# This file intentionally has no build: and no implicit latest tag.
services:
  emby-in-one:
    image: "${EIO_IMAGE:?Set EIO_IMAGE to a verified published image tag or digest}"
    user: "1000:1000"
    ports:
      # Loopback by default. Set EIO_BIND_ADDRESS=0.0.0.0 only for intended exposure.
      - "${EIO_BIND_ADDRESS:-127.0.0.1}:${EIO_HTTP_PORT:-8096}:8096"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
