name: Release

# Uppercase V tags publish six static binaries, panel/scripts and a Docker
# source archive with checksums. Suffix tags are Pre-releases, never Latest.
on:
  push:
    tags: ['V[0-9]*']
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
env:
  GOMAXPROCS: '1'
  GOFLAGS: '-p=1'
jobs:
  checks:
    name: Release Go build, vet and regression
    if: github.repository == 'ArizeSky/Emby-In-One'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: golang:1.23-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, vet and full ordinary regression
        run: |
          set -eu
          nice -n 19 go build -buildvcs=false ./...
          nice -n 19 go vet ./...
          nice -n 19 go test -parallel 1 -timeout 15m ./...

  build:
    name: Static Linux ${{ matrix.arch }}
    if: github.repository == 'ArizeSky/Emby-In-One'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: golang:1.23-bookworm
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cc: gcc
            packages: build-essential
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - arch: arm
            cc: arm-linux-gnueabihf-gcc
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
            goarm: '7'
          - arch: mips
            cc: mips-linux-gnu-gcc
            packages: gcc-mips-linux-gnu libc6-dev-mips-cross
          - arch: mipsle
            cc: mipsel-linux-gnu-gcc
            packages: gcc-mipsel-linux-gnu libc6-dev-mipsel-cross
          - arch: riscv64
            cc: riscv64-linux-gnu-gcc
            packages: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install target C toolchain
        env:
          CROSS_PACKAGES: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends file $CROSS_PACKAGES
      - name: Build and verify static binary
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          CC: ${{ matrix.cc }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -euo pipefail
          VERSION="v${TAG#V}"
          mkdir -p dist
          binary="dist/Emby-In-One-linux-${ARCH}-${VERSION}"
          CGO_ENABLED=1 GOOS=linux GOARCH="$ARCH" nice -n 19 \
            go build -trimpath -buildvcs=false -tags "netgo osusergo" \
            -ldflags "-s -w -X main.Version=${VERSION} -extldflags -static" \
            -o "$binary" ./cmd/emby-in-one
          file "$binary"
          file "$binary" | grep -q 'statically linked'
          if [ "$ARCH" = amd64 ]; then test "$("$binary" --version)" = "$VERSION"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: dist/
          retention-days: 5
          if-no-files-found: error

  package:
    name: Package release assets
    if: github.repository == 'ArizeSky/Emby-In-One'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Require every binary and verify version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="v${TAG#V}"
          for arch in amd64 arm64 arm mips mipsle riscv64; do
            test -s "dist/Emby-In-One-linux-${arch}-${VERSION}"
          done
          chmod +x "dist/Emby-In-One-linux-amd64-${VERSION}"
          test "$("dist/Emby-In-One-linux-amd64-${VERSION}" --version)" = "$VERSION"
      - name: Stage panel and script assets
        run: |
          cp public/admin.html public/admin.js dist/
          cp emby-in-one-cli.sh release-install.sh dist/

      - name: Build Docker source archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="v${TAG#V}"
          # 容器 job 的工作区属主与运行用户不一致，git archive 前先声明信任
          # （go build 的 VCS 戳记就是栽在这个属主差异上，见上一步注释）。
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          # emby-in-one-cli.sh 的 Docker 模式在线更新按此清单解包部署
          # （cmd / internal / third_party / public / go.mod + Dockerfile 等）。
          # git archive 只含已提交文件，并按 .gitattributes 统一为 LF 行尾。
          git archive --format=tar.gz --prefix="emby-in-one/" \
            -o "dist/Emby-In-One-docker-${VERSION}.tar.gz" HEAD \
            cmd internal third_party public go.mod \
            Dockerfile .dockerignore docker-compose.yml \
            install.sh eio-docker.sh docker-compose.image.yml DOCKER.md DOCKER_EN.md RELEASING.md \
            emby-in-one-cli.sh \
            README.md README_EN.md Update.md LICENSE

      - name: Generate .sha256 for every asset
        run: |
          set -euo pipefail
          cd dist
          # 校验和文件里记录的是裸文件名（sha256sum 的第二列），
          # 与 release-install.sh verify_sha256 按 URL 末段匹配的解析方式一致。
          for f in *; do
            [[ "$f" == *.sha256 ]] && continue
            sha256sum "$f" > "${f}.sha256"
          done
          ls -l

      - name: Extract release notes from Update.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="v${TAG#V}"
          # 预发布判定：tag 带后缀（如 V1.4.5-rc1）即预发布。
          PRERELEASE=false
          BASE_TAG="$TAG"
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE=true
            BASE_TAG="${TAG%%-*}"
          fi
          # 取 Update.md 里 "## <tag>" 小节直到下一个 "## " 标题为止；
          # 边界排除数字与点，避免 V1.4.4 误匹配 V1.4.40。
          extract_section() {
            awk -v tag="$1" '
              $0 ~ "^## " tag "([^0-9.]|$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' Update.md
          }
          # 优先取与 tag 完全一致的章节；预发布没有专属章节时回退到
          # 去掉后缀的基础版本章节。
          FELLBACK=false
          extract_section "$TAG" > section.md
          if ! grep -q '[^[:space:]]' section.md && [[ "$PRERELEASE" == true ]]; then
            extract_section "$BASE_TAG" > section.md
            FELLBACK=true
          fi
          if ! grep -q '[^[:space:]]' section.md; then
            echo "::error::Update.md 中没有找到 ${TAG}（或基础版本 ${BASE_TAG}）的更新日志章节，发布中止" >&2
            exit 1
          fi
          {
            echo "# Emby In One ${TAG}"
            echo
            if [[ "$PRERELEASE" == true ]]; then
              echo "> ⚠️ **预发布版本**，供测试尝鲜；不带参数的安装脚本仍会安装最新稳定版。"
              if [[ "$FELLBACK" == true ]]; then
                echo "> 更新日志取自 ${BASE_TAG} 章节。"
              fi
              echo
            fi
            echo "## 安装 / 升级（二进制 · systemd）"
            echo
            echo '```bash'
            echo "curl -fsSL -o release-install.sh https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/release-install.sh"
            if [[ "$PRERELEASE" == true ]]; then
              # 预发布不是 releases/latest，安装时必须显式指定版本
              echo "sudo bash release-install.sh ${TAG}"
            else
              echo 'sudo bash release-install.sh'
            fi
            echo '```'
            echo
            if [[ "$PRERELEASE" == true ]]; then
              echo "SSH 菜单的在线更新只会升级到最新稳定版；安装本预发布需用上面的命令显式指定版本，Docker 模式可用菜单 [15] 指定 ${TAG} 重建。"
            else
              echo "已安装用户可在 SSH 菜单（\`emby-in-one\` 命令）中选择在线更新；Docker 部署的在线更新使用本页的 Emby-In-One-docker-${VERSION}.tar.gz。"
            fi
            echo
            echo "---"
            echo
            cat section.md
          } > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Create GitHub release
    if: github.repository == 'ArizeSky/Emby-In-One'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require exact-source CI before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait-release-ci.py
      - uses: actions/download-artifact@v4
        with:
          name: release-assets

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 带后缀的 tag（V1.4.5-rc1）发布为 Pre-release：releases/latest 仍指向
          # 上一个正式版，不带参数的安装/在线更新不会拿到预发布。
          PRERELEASE_ARGS=()
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease --latest=false)
          fi
          # 幂等：重跑失败的发布时 Release 可能已创建，改为补传/覆盖资产。
          # release-notes.md 只作为正文，不作为资产上传。
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${PRERELEASE_ARGS[@]}" \
              dist/*
          fi
          echo "已发布资产："
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
