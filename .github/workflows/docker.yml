name: Docker image

# Manual only. Run this trusted workflow from the default branch, select source
# using release_tag + expected_sha, never by an arbitrary version override.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [validate, publish]
        default: validate
        required: true
      release_tag:
        description: 'Exact existing V/v SemVer tag; blank allowed only for development validation'
        default: ''
      expected_sha:
        description: 'Expected full 40-character source commit SHA'
        required: true
      promote_latest:
        description: 'Explicitly promote current published stable Release to latest (never rc)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-release-promotion
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify trusted workflow, exact source and version
        id: identity
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONFIRM_LATEST: ${{ inputs.promote_latest }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          if [ -n "$RELEASE_TAG" ]; then
            export RESOLVED_SHA
            RESOLVED_SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
            node scripts/docker-release-policy.cjs identity > "$RUNNER_TEMP/identity.json"
            version=$(jq -r .version "$RUNNER_TEMP/identity.json")
            sha=$(jq -r .sha "$RUNNER_TEMP/identity.json")
          else
            test "$MODE" = validate
            test "$CONFIRM_LATEST" != true
            sha=$(git rev-parse --verify "$EXPECTED_SHA^{commit}")
            test "${sha,,}" = "${EXPECTED_SHA,,}"
            version="dev-${sha:0:12}"
          fi
          printf 'version=%s\nsha=%s\n' "$version" "$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: policy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - name: Build trusted recipe against exact source (no registry credentials)
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          REVISION: ${{ needs.identity.outputs.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$REVISION"
          mkdir -p dist
          docker build -f policy/Dockerfile --build-arg "VERSION=$VERSION" --build-arg "REVISION=$REVISION" --label "org.opencontainers.image.build-recipe=$GITHUB_SHA" -t "eio-validated:$ARCH" source
          bash policy/scripts/docker-image-smoke.sh "eio-validated:$ARCH" "$VERSION" "$REVISION"
          docker save "eio-validated:$ARCH" | gzip -1 > "dist/image-$ARCH.tar.gz"
          (cd dist && sha256sum "image-$ARCH.tar.gz" > "image-$ARCH.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: validated-${{ matrix.arch }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    if: inputs.mode == 'publish' && inputs.release_tag != ''
    needs: [identity, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: validated-*
          path: images
          merge-multiple: true
      - name: Recheck identity and latest policy before registry writes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          CONFIRM_LATEST: ${{ inputs.promote_latest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export RESOLVED_SHA
          RESOLVED_SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          node scripts/docker-release-policy.cjs identity
          if [ "$CONFIRM_LATEST" = true ]; then
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
            current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            export RELEASE_JSON
            RELEASE_JSON=$(jq --arg current "$current" '. + {isCurrentStable: (.tag_name == $current)}' <<< "$release")
            node scripts/docker-release-policy.cjs latest
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push validated candidate and promote same digest (no rebuild)
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          REVISION: ${{ needs.identity.outputs.sha }}
          CONFIRM_LATEST: ${{ inputs.promote_latest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate="candidate-${REVISION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for arch in amd64 arm64; do
            (cd images && sha256sum -c "image-$arch.tar.gz.sha256")
            gzip -dc "images/image-$arch.tar.gz" | docker load
            test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "eio-validated:$arch")" = "$REVISION"
            docker tag "eio-validated:$arch" "$repo:$candidate-$arch"
            docker push "$repo:$candidate-$arch"
          done
          docker buildx imagetools create --tag "$repo:$candidate" "$repo:$candidate-amd64" "$repo:$candidate-arm64"
          digest=$(node scripts/docker-release-policy.cjs inspect "$repo:$candidate")
          test "$digest" != absent
          docker buildx imagetools inspect "$repo@$digest" --raw > "$RUNNER_TEMP/index.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64","arm64"]' "$RUNNER_TEMP/index.json"
          existing=$(node scripts/docker-release-policy.cjs inspect "$repo:$VERSION")
          decision=$(node scripts/docker-release-policy.cjs immutable "$existing" "$digest")
          if [ "$decision" = create ]; then docker buildx imagetools create --tag "$repo:$VERSION" "$repo@$digest"; fi
          test "$(node scripts/docker-release-policy.cjs inspect "$repo:$VERSION")" = "$digest"
          if [ "$CONFIRM_LATEST" = true ]; then
            # Revalidate stable Release immediately before moving latest.
            tag="$RELEASE_TAG"
            export RELEASE_JSON RELEASE_VERSION="$VERSION"
            current=$(GH_TOKEN="$REGISTRY_PASSWORD" gh api "repos/$GITHUB_REPOSITORY/releases/latest")
            RELEASE_JSON=$(jq --arg tag "$tag" '. + {isCurrentStable: (.tag_name == $tag)}' <<< "$current")
            node scripts/docker-release-policy.cjs latest
            docker buildx imagetools create --tag "$repo:latest" "$repo@$digest"
            test "$(node scripts/docker-release-policy.cjs inspect "$repo:latest")" = "$digest"
          fi
          printf 'source=%s\nimage=%s@%s\nversion=%s\n' "$REVISION" "$repo" "$digest" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
